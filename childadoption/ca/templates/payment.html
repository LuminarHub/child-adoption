{% extends 'base.html' %}
{% load static %}

{% block donate %}
<div class="container">
  <div class="row" style="height:90vh;padding-top:10rem;">
    {% for msg in messages %}
    {% if msg.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>{{msg}}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% else %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>{{msg}}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}
    {% endfor %}
    <div class="col-12">
      <h1 class="text-center">Complete Your Payment</h1>

      <button id="rzp-button1">Pay with Razorpay</button>
      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
      <script>
      var options = {
          "key": "{{ api_key }}", // Enter the Key ID generated from the Dashboard
          "amount": "{{ amount }}", // Amount in paise
          "currency": "INR",
          "name": "Take Care",
          "description": "Test Transaction",
          "image": "https://example.com/your_logo",
          "order_id": "{{ order_id }}", // Order ID from Razorpay
          "handler": function (response) {
              window.location.href = "{% url 'home' %}?status=success&type=donation&payment_id=" + response.razorpay_payment_id + "&order_id=" + response.razorpay_order_id + "&signature=" + response.razorpay_signature + "&donation_id={{ donation.id }}";
          },
          "prefill": {
              "name": "{{ donation.personal_details.fname }} {{ donation.personal_details.lname }}",
              "email": "{{ donation.personal_details.emailaddress }}",
              "contact": "{{ donation.personal_details.phone_number }}"
          },
          "notes": {
              "address": "Razorpay Corporate Office"
          },
          "theme": {
              "color": "#3399cc"
          }
      };
      var rzp1 = new Razorpay(options);
      rzp1.on('payment.failed', function (response) {
          window.location.href = "{% url 'home' %}?status=failed&type=donation&code=" + response.error.code + "&description=" + response.error.description;
      });
      document.getElementById('rzp-button1').onclick = function(e){
          rzp1.open();
          e.preventDefault();
      }
      </script>
    </div>
  </div>
</div>
{% endblock donate %}
