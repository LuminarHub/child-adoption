<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body style="background-color: rgb(163, 165, 168);" >
    

<div class="container-fluid" style="height:29rem;">
    <div class="row ">
        <div class="d-flex justify-content-between  p-3"  style="background-color: rgb(117, 115, 112);">
            <a href="/" class="btn fw-bold"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="text-center  text-white ">Organization Panel</h1>
            <h3></h3>
        </div>
        <div class="col-2 pt-3 "   style="min-height: 50rem; background-color: #828384;">
           <div class="mb-2">
            <a class="text-dark " href="{% url 'org'%}">
                <div class=" text-center fw-bold rounded-2 p-2 "style="background-color: rgb(168, 223, 231);">
                    Home
                </div>
            </a>
           </div>
           <div class="mb-2">
            <a class="text-dark "  href="{% url 'ad_rst'%}">
                <div class=" text-center fw-bold rounded-2 p-2 " style="background-color: rgb(168, 223, 231);">
                    Adoption Requests
                </div>
            </a>
           </div>
           <div class="mb-2">
            <a class="text-dark "  href="{% url 'chi'%}">
                <div class=" text-center fw-bold rounded-2 p-2 " style="background-color: rgb(168, 223, 231);">
                    Childs
                </div>
            </a>
           </div>
           <div class="mb-2">
            <a class="text-dark " href="{% url 'org_sp'%}">
                <div class=" text-center fw-bold rounded-2 p-2 "style="background-color: rgb(168, 223, 231);">
                    SponserShip
                </div>
            </a>
           </div>
           <div class="mb-2">
            <a class="text-dark " href="{% url 'org_dn'%}">
                <div class=" text-center fw-bold rounded-2 p-2 "style="background-color: rgb(168, 223, 231);">
                    Donations
                </div>
            </a>
           </div>
           <div class="mb-2">
            <a class="text-dark " href="{% url 'org_ch_ap'%}">
                <div class=" text-center fw-bold rounded-2 p-2 "style="background-color: rgb(168, 223, 231);">
                    Child Appoinments
                </div>
            </a>
           </div>
           <div class="mb-2">
            <a class="text-dark " href="{% url 'org_csl' %}">
                <div class=" text-center fw-bold rounded-2 p-2 "style="background-color: rgb(168, 223, 231);">
                    Life Time Sponser Ship
                </div>
            </a>
           </div>
           {% comment %} <div class="mb-2">
            <a class="text-dark " href="">
                <div class=" text-center fw-bold rounded-2 p-2 "style="background-color: rgb(168, 223, 231);">
                    Child Sponser Ship
                </div>
            </a>
           </div> {% endcomment %}
          
        </div>
        <div class="col-10 pt-5 ">
          {% block home%}

          {%endblock home%}
        </div>
    </div>
</div>
</body>
</html>
